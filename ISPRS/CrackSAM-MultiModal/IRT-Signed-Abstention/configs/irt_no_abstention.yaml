# A5 — sans abstention : deux actions, softmax(q⁺, q⁻).
#
# Δz = δ_max (π⁺ − π⁻) reste nul exactement à l'initialisation — softmax(0,0)
# donne π⁺ = π⁻ = 0,5 — mais le modèle ne peut plus DÉCLARER qu'il s'abstient.
# Le terme d'activité est désactivé : sans action « s'abstenir » il vaudrait 1
# partout, soit une constante ajoutée au coût.

identifier: A5
name: frangi_no_abstention

arm:
  evidence_source: frangi
  permuted: false
  trained: true
  model:
    head: signed
    hidden_channels: 32
    delta_max: 12.0
    logit_clip: 20.0
    correction_scope: global

# --------------------------------------------------------------------------- #
# Bloc partagé — identique dans les sept fichiers, à la ligne près.
# Un réglage par bras se verrait immédiatement dans le diff : c'est le but.
# --------------------------------------------------------------------------- #

thermal:
  encoding: auto
  scales: [1.0, 3.0, 5.0, 9.0, 15.0]
  R: 3
  tau: 0.18
  K: 1

loss:
  bce_weight: 0.5
  dice_weight: 0.5
  tolerant_weight: 0.25
  tolerant_radius: 3
  regularization:
    residual_l1_weight: 1.0e-3
    active_weight: 1.0e-4
    conflict_weight: 1.0e-3

training:
  optimizer: adamw
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  batch_size: 8
  max_epochs: 100
  early_stopping_patience: 15
  gradient_clip_norm: 1.0
  amp: true
  selection_metric: iou_buffered_tol3
  seeds: [13, 37, 73]
