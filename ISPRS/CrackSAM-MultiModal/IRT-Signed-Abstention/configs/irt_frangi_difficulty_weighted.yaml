# A7 — A2, mais la perte est pondérée par la marge de progression de la baseline.
#
# Motivé par le diagnostic de la campagne du 12 août : le gain de l'évidence
# thermique se concentre sur le tiers du test où la baseline échoue
# (+0,0117 d'IoU à 3 px, IC95 excluant zéro) et s'INVERSE sur le tiers moyen
# (-0,0038, IC95 excluant zéro aussi). Une perte qui moyenne uniformément est
# donc dominée par des images où il n'y a rien à gagner et tout à casser.
#
# Le poids d'une image est 1 - IoU_baseline à 3 px, calculé sur le TRAIN seul,
# normalisé à moyenne 1 et plafonné à 5x. Rien d'autre ne change : même
# évidence, même tête, même capacité, mêmes hyperparamètres.

identifier: A7
name: frangi_difficulty_weighted

arm:
  evidence_source: frangi
  permuted: false
  trained: true
  difficulty_weighted: true
  model:
    head: signed_abstention
    hidden_channels: 32
    delta_max: 12.0
    logit_clip: 20.0
    correction_scope: global

# --------------------------------------------------------------------------- #
# Bloc partagé — identique dans les sept fichiers, à la ligne près.
# Un réglage par bras se verrait immédiatement dans le diff : c'est le but.
# --------------------------------------------------------------------------- #

thermal:
  encoding: auto
  scales: [1.0, 3.0, 5.0, 9.0, 15.0]
  R: 3
  tau: 0.18
  K: 1

loss:
  bce_weight: 0.5
  dice_weight: 0.5
  tolerant_weight: 0.25
  tolerant_radius: 3
  regularization:
    residual_l1_weight: 1.0e-3
    active_weight: 1.0e-4
    conflict_weight: 1.0e-3

training:
  optimizer: adamw
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  batch_size: 8
  max_epochs: 100
  early_stopping_patience: 15
  gradient_clip_norm: 1.0
  amp: true
  selection_metric: iou_buffered_tol3
  seeds: [13, 37, 73]
