# A6 — renforcement seul : Δz = δ_max σ(q) S_max.
#
# Ce bras ne peut que renforcer. Il NE satisfait PAS l'identité bit-à-bit à
# l'initialisation, et c'est mathématiquement inévitable : une correction non
# négative, nulle au point d'initialisation et de gradient non nul en ce point
# n'existe pas. Il part de σ(−8) ≈ 3,4·10⁻⁴, soit |Δz| ≤ 1,3·10⁻³.

identifier: A6
name: positive_only

arm:
  evidence_source: frangi
  permuted: false
  trained: true
  model:
    head: positive_only
    hidden_channels: 32
    delta_max: 12.0
    logit_clip: 20.0
    correction_scope: global

# --------------------------------------------------------------------------- #
# Bloc partagé — identique dans les sept fichiers, à la ligne près.
# Un réglage par bras se verrait immédiatement dans le diff : c'est le but.
# --------------------------------------------------------------------------- #

thermal:
  encoding: auto
  scales: [1.0, 3.0, 5.0, 9.0, 15.0]
  R: 3
  tau: 0.18
  K: 1

loss:
  bce_weight: 0.5
  dice_weight: 0.5
  tolerant_weight: 0.25
  tolerant_radius: 3
  regularization:
    residual_l1_weight: 1.0e-3
    active_weight: 1.0e-4
    conflict_weight: 1.0e-3

training:
  optimizer: adamw
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  batch_size: 8
  max_epochs: 100
  early_stopping_patience: 15
  gradient_clip_norm: 1.0
  amp: true
  selection_metric: iou_buffered_tol3
  seeds: [13, 37, 73]
