name: EUVIP oral presentation

on:
  push:
    branches: [main]
    paths:
      - 'EUVIP/presentation/**'
      - '!EUVIP/presentation/Presentation_EUVIP_2026_Hauseux.pdf'
      - '!EUVIP/presentation/apercu.png'
      - '.github/workflows/euvip-presentation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: euvip-presentation-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out presentation sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: EUVIP/presentation
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-luatex texlive-latex-extra texlive-fonts-recommended lmodern python3-fitz python3-pil python3-cairosvg
      - name: Compile, validate and render
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          make -C EUVIP/presentation check PYTHON=/usr/bin/python3
      - name: Store PDF, renders and editable archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EUVIP-2026-presentation
          if-no-files-found: error
          retention-days: 30
          path: |
            EUVIP/presentation/Presentation_EUVIP_2026_Hauseux.pdf
            EUVIP/presentation/apercu.png
            EUVIP/presentation/build/qa.json
            EUVIP/presentation/build/render/*.png
            EUVIP/presentation/build/Presentation_EUVIP_2026_sources.zip
      - name: Publish generated files on main
        run: |
          set -euo pipefail
          built_from="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$built_from" ]; then
            if ! git diff --quiet "$built_from" origin/main -- EUVIP/presentation .github/workflows/euvip-presentation.yml; then
              echo 'Presentation sources changed during compilation; refusing to publish a stale build.' >&2
              exit 1
            fi
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EUVIP/presentation/theme EUVIP/presentation/assets/VTGraF_granularite.png EUVIP/presentation/assets/cerema-official.svg EUVIP/presentation/assets/cerema-official.pdf EUVIP/presentation/assets/cerema-official.source.txt EUVIP/presentation/Presentation_EUVIP_2026_Hauseux.pdf EUVIP/presentation/apercu.png
          if git diff --cached --quiet; then
            echo 'Generated files are already up to date.'
            exit 0
          fi
          git commit -m 'Build EUVIP oral presentation PDF and vendor presentation assets'
          git rebase origin/main
          git push origin HEAD:main
